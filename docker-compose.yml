services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  overlay-app:
    build: ./backend
    ports:
      - "8080:8080"   # Порт для OBS (браузер)
      - "44444:44444" # Порт для приема GSI от Dota 2
    environment:
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped