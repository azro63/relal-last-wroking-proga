spring:
  application:
    name: overlay

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.sue.overlay: DEBUG
