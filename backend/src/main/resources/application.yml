spring:
  application:
    name: overlay
  datasource:
    url: jdbc:postgresql://localhost:5432/overlay
    username: overlay
    password: overlay
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

app:
  overlay:
    token-ttl: PT24H
  ingestion:
    dota:
      enabled: true
      poll-interval: 10s
    cs2:
      enabled: true
      poll-interval: 15s

logging:
  level:
    com.yourname.overlay: DEBUG